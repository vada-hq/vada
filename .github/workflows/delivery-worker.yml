name: delivery-worker

# 배송 작업 실행기를 상시 프로세스 대신 주기적으로 실행한다. 절차는 docs/delivery-worker.md 참고.
on:
  schedule:
    # 6시간마다(UTC 02:17, 08:17, 14:17, 20:17). 정각은 예약 실행 지연이 잦아 피한다.
    - cron: '17 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

# 실행이 겹치면 같은 작업의 잠금만 기다리게 되므로 한 번에 하나만 돌린다.
concurrency:
  group: delivery-worker
  cancel-in-progress: false

jobs:
  drain:
    # 저장소 변수로 켠다. 꺼져 있으면 건너뛰어 실행 시간을 쓰지 않는다.
    if: vars.DELIVERY_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run delivery:worker:once --workspace @vada/api
        env:
          # API 서버와 같은 DB·공개 주소·비밀키여야 콜백 URL이 일치한다.
          DATABASE_URL: ${{ secrets.DELIVERY_DATABASE_URL }}
          DELIVERY_ENABLED: 'true'
          DELIVERY_TRACKING_ENABLED: 'true'
          DELIVERY_TRACKER_CLIENT_ID: ${{ secrets.DELIVERY_TRACKER_CLIENT_ID }}
          DELIVERY_TRACKER_CLIENT_SECRET: ${{ secrets.DELIVERY_TRACKER_CLIENT_SECRET }}
          DELIVERY_PUBLIC_URL: ${{ secrets.DELIVERY_PUBLIC_URL }}
          DELIVERY_WEBHOOK_SECRET: ${{ secrets.DELIVERY_WEBHOOK_SECRET }}
