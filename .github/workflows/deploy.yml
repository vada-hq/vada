# main에 들어온 것을 사람 손 없이 배포한다.
#
# 걷는 뼈대의 완료 기준 첫째와 둘째가 이 파일이다 — "머지하면 배포된다"와
# "배포된 것에 대고 검사가 돈다". 한 번 배포하는 것은 뼈대가 아니다.
#
# 장기 액세스 키를 두지 않는다. GitHub이 발급한 신원 증명으로 AWS 역할을 맡는다.
# 그 증명은 이 저장소의 main에서 도는 워크플로에만 나온다.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 배포가 겹치면 나중 것이 먼저 끝나 옛 코드가 남을 수 있다. 한 번에 하나만 돈다.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # OIDC 증명을 받으려면 필요하다
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Lambda는 Amazon Linux에서 돈다. 빌드하는 기계가 Windows든 Linux든
      # 상관없이 그 플랫폼용 휠을 받아야 한다.
      #
      # 소스 빌드를 막는다(`--only-binary`). 막지 않으면 대상 플랫폼 휠이 없는
      # 의존성을 빌드 기계용으로 조용히 빌드해 두고, 그 사실은 배포된 뒤 첫
      # 요청에서야 드러난다.
      #
      # manylinux2014가 아니라 manylinux_2_28을 겨냥한다. Python 3.13 런타임은
      # Amazon Linux 2023(glibc 2.34) 위에서 돌고, greenlet 같은 것은 더 이상
      # manylinux2014 휠을 내지 않는다.
      #
      # 의존성과 우리 코드를 나눠 넣는다. `--only-binary`는 우리 프로젝트까지
      # 소스 빌드 금지 대상으로 잡아 버린다. 우리 코드는 순수 파이썬이라
      # 빌드할 것이 없고 그대로 복사하면 된다.
      - name: Build the Lambda package
        run: |
          rm -rf ../../.artifacts
          uv export --frozen --no-dev --no-emit-project \
            --format requirements-txt -o /tmp/lambda-requirements.txt
          uv pip install \
            --target ../../.artifacts/package \
            -r /tmp/lambda-requirements.txt \
            --python-platform x86_64-manylinux_2_28 \
            --python-version 3.13 \
            --only-binary=:all:
          cp -r src/vada_api ../../.artifacts/package/
          cd ../../.artifacts/package
          zip -qr ../api.zip .
          echo "꾸러미 $(du -sh ../api.zip | cut -f1)"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 화면도 같이 꾸린다. AWS에 손대기 **전에** 꾸린다 — 빌드가 깨졌다면
      # 아무것도 바꾸지 않은 채로 실패하는 것이 낫다.
      - name: Build the screen
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web build
          echo "화면 $(du -sh apps/web/dist | cut -f1)"

      # AWS가 역할을 거절하면 이유를 말해 주지 않는다. "Not authorized"뿐이다.
      # 그래서 GitHub이 무엇을 주장하는지 먼저 찍는다. 신뢰 정책과 한 글자만
      # 달라도 거절되는데, 그 한 글자를 눈으로 봐야 고칠 수 있다.
      #
      # 토큰 자체는 찍지 않는다. 청구항만 본다.
      - name: Show what GitHub asserts about this run
        run: |
          token="$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')"
          payload="$(echo "${token}" | cut -d. -f2 | tr '_-' '/+')"
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          echo "${payload}" | base64 -d \
            | jq '{iss, aud, sub, repository, repository_id, repository_owner_id, ref}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      - name: Terraform
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -input=false -auto-approve

      - name: Read what was deployed
        id: deployed
        working-directory: infra
        run: |
          {
            echo "url=$(terraform output -raw api_base_url)"
            echo "web_url=$(terraform output -raw web_base_url)"
            echo "web_bucket=$(terraform output -raw web_bucket)"
            echo "web_distribution=$(terraform output -raw web_distribution_id)"
            echo "client_id=$(terraform output -raw user_pool_client_id)"
            echo "login_url=$(terraform output -raw login_base_url)"
            echo "login_callback=$(terraform output -raw login_callback_url)"
            echo "email=$(terraform output -raw verification_email)"
            echo "password_parameter=$(terraform output -raw verification_password_parameter)"
            echo "database_parameter=$(terraform output -raw database_url_parameter)"
            echo "database_branch=$(terraform output -raw database_branch)"
            echo "subject=$(terraform output -raw verification_subject)"
            echo "issuer=$(terraform output -raw user_pool_issuer)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the built screen
        id: published
        working-directory: apps/web
        env:
          BUCKET: ${{ steps.deployed.outputs.web_bucket }}
          DISTRIBUTION: ${{ steps.deployed.outputs.web_distribution }}
          LOGIN_URL: ${{ steps.deployed.outputs.login_url }}
          CLIENT_ID: ${{ steps.deployed.outputs.client_id }}
        run: |
          # 로그인 상대가 누구인지는 배포 사실이지 빌드 사실이 아니다. 빌드에
          # 구우면 빌드 결과가 환경에 묶이고, 그러면 언젠가 다른 환경에서 구운
          # 것이 올라간다 — 그 사실은 사람이 로그인해 봐야 드러난다.
          #
          # 비밀이 아니다. 앱 클라이언트 ID는 어차피 브라우저에 실린다.
          jq -n --arg loginDomain "${LOGIN_URL}" --arg clientId "${CLIENT_ID}" \
            '{loginDomain: $loginDomain, clientId: $clientId}' > dist/config.json

          # 이름에 내용 해시가 든 파일부터 올린다. 순서를 뒤집으면 새 index.html이
          # 아직 올라오지 않은 조각을 가리키는 순간이 생긴다.
          #
          # 옛 조각을 지우지 않는다(`--delete` 없음). 페이지를 열어 둔 사람이
          # 아직 안 받은 조각을 그때 요청할 수 있고, 지우면 그 사람만 깨진다.
          # 이름이 내용마다 달라 남아 있어도 섞이지 않는다.
          aws s3 sync dist/assets "s3://${BUCKET}/assets" \
            --cache-control 'public,max-age=31536000,immutable'

          # index.html은 이름이 고정이다. 캐시하면 새 배포가 아무에게도 안 보인다.
          aws s3 sync dist "s3://${BUCKET}" --delete --exclude 'assets/*' \
            --cache-control 'no-cache'

          # 비우기를 걸어만 두고 기다리지 않는다. 아래 검사들이 도는 동안 끝난다.
          id="$(aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION}" --paths '/*' \
            --query 'Invalidation.Id' --output text)"
          echo "invalidation=${id}" >> "$GITHUB_OUTPUT"
          echo "올렸습니다. 캐시를 비우는 중: ${id}"

      # 검사용 계정은 Cognito에만 있다. VADA에는 없다. 이름을 돌려받으려면
      # 그 신원이 데이터베이스에도 있어야 한다.
      #
      # 사람을 등록하는 흐름(ONB-01·ORG-01)은 아직 없다. 그것이 생기면 이
      # 단계는 사라진다 — 그때는 사람이 가입하는 길로 들어온다.
      - name: Give the check user a name in the database
        env:
          DATABASE_PARAMETER: ${{ steps.deployed.outputs.database_parameter }}
          EXPECTED_BRANCH: ${{ steps.deployed.outputs.database_branch }}
          SUBJECT: ${{ steps.deployed.outputs.subject }}
          ISSUER: ${{ steps.deployed.outputs.issuer }}
        run: |
          url="$(aws ssm get-parameter --name "${DATABASE_PARAMETER}" \
            --with-decryption --query 'Parameter.Value' --output text)"
          # SQLAlchemy의 방언 접미사는 psql이 모른다.
          plain="${url/postgresql+psycopg:/postgresql:}"

          # **어디에 쓰는지 확인하고 쓴다.** 주소는 비밀이라 로그에 못 남기는데,
          # 그러면 잘못된 데이터베이스에 써도 로그가 똑같아 보인다. 실제로
          # 개발용과 배포용에 같은 문자열이 들어갔고, 배포는 초록불이었다.
          # `{"name":"배포 확인용 계정"}`까지 정확히 기대한 대로 돌아왔다 —
          # 개발용 데이터베이스에 쓰고 그것을 도로 읽었기 때문이다.
          #
          # 브랜치 ID는 비밀이 아니고 자격 증명도 아니다. 어느 데이터베이스인지만
          # 말한다. 그래서 정본(`infra/variables.tf`)에 적어 두고 맞춰 볼 수 있다.
          branch="$(psql "${plain}" -tAqc \
            "select current_setting('neon.branch_id', true)")"
          echo "배포용 데이터베이스 브랜치: ${branch}"
          if [ "${branch}" != "${EXPECTED_BRANCH}" ]; then
            echo "정본이 기대하는 것은 ${EXPECTED_BRANCH}입니다."
            echo "SSM의 연결 문자열이 다른 데이터베이스를 가리킵니다."
            echo "개발용 문자열이 들어갔을 가능성이 큽니다 — infra/README.md를 보십시오."
            exit 1
          fi

          psql "${plain}" -v ON_ERROR_STOP=1 -q <<SQL
          INSERT INTO vada_users (user_id, display_name)
          VALUES ('${SUBJECT}', '배포 확인용 계정')
          ON CONFLICT (user_id) DO UPDATE SET display_name = EXCLUDED.display_name;

          INSERT INTO cognito_identities (issuer, subject, user_id)
          VALUES ('${ISSUER}', '${SUBJECT}', '${SUBJECT}')
          ON CONFLICT (issuer, subject) DO UPDATE SET user_id = EXCLUDED.user_id;
          SQL
          echo "검사용 신원을 넣었습니다."

      # 배포되었다는 것과 도는 것은 다른 사실이다. 배포된 주소에 대고 확인한다.
      # 로컬에서 통과한 검사는 이 질문에 답하지 못한다.
      - name: Check the deployed address answers
        run: |
          url="${{ steps.deployed.outputs.url }}"
          echo "확인 대상: ${url}/health"
          for attempt in 1 2 3 4 5; do
            body="$(curl -fsS --max-time 20 "${url}/health" || true)"
            if [ "${body}" = '{"status":"ok"}' ]; then
              echo "응답: ${body}"
              exit 0
            fi
            echo "아직 아닙니다 (${attempt}/5): ${body:-무응답}"
            sleep 5
          done
          echo "배포된 주소가 답하지 않습니다."
          exit 1

      # 인증은 **양쪽을 다 확인해야** 한다. 통과하는 것만 보면 "권한 부여자가
      # 붙어는 있는데 아무나 통과"를 못 잡는다. 그 실패는 조용하다.
      - name: Check the auth boundary refuses and admits
        env:
          URL: ${{ steps.deployed.outputs.url }}
          CLIENT_ID: ${{ steps.deployed.outputs.client_id }}
          EMAIL: ${{ steps.deployed.outputs.email }}
          PASSWORD_PARAMETER: ${{ steps.deployed.outputs.password_parameter }}
        run: |
          refused="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "${URL}/whoami")"
          if [ "${refused}" != "401" ]; then
            echo "토큰 없이 부른 요청이 ${refused}로 통과했습니다. 401이어야 합니다."
            exit 1
          fi
          echo "토큰 없음 → ${refused}"

          password="$(aws ssm get-parameter --name "${PASSWORD_PARAMETER}" \
            --with-decryption --query 'Parameter.Value' --output text)"
          token="$(aws cognito-idp initiate-auth \
            --auth-flow USER_PASSWORD_AUTH \
            --client-id "${CLIENT_ID}" \
            --auth-parameters "USERNAME=${EMAIL},PASSWORD=${password}" \
            --query 'AuthenticationResult.AccessToken' --output text)"

          # 토큰은 찍지 않는다. 응답만 본다.
          body="$(curl -fsS --max-time 20 -H "Authorization: Bearer ${token}" "${URL}/whoami")"
          echo "토큰 있음 → ${body}"

          echo "${body}" | grep -q '"subject"' || {
            echo "청구항이 코드까지 오지 않았습니다."
            exit 1
          }

          # **이름이 돌아왔다는 것이 데이터베이스를 읽었다는 증거다.**
          # 이름은 Cognito 토큰에 없다. PostgreSQL에만 있다.
          echo "${body}" | grep -q '"name":"배포 확인용 계정"' || {
            echo "이름이 돌아오지 않았습니다. 배포된 함수가 데이터베이스를 못 읽습니다."
            exit 1
          }

      # 여기까지는 전부 API Gateway 주소에 대고 물었다. 사람이 여는 주소는
      # 그것이 아니다. 사람이 여는 곳에서 다시 묻는다.
      - name: Check the deployed screen answers
        env:
          URL: ${{ steps.deployed.outputs.web_url }}
          DISTRIBUTION: ${{ steps.deployed.outputs.web_distribution }}
          INVALIDATION: ${{ steps.published.outputs.invalidation }}
          LOGIN_URL: ${{ steps.deployed.outputs.login_url }}
          LOGIN_CALLBACK: ${{ steps.deployed.outputs.login_callback }}
          CLIENT_ID: ${{ steps.deployed.outputs.client_id }}
        run: |
          # 다 비워지기 전에 물으면 **지난 배포**를 확인하고 초록불을 준다.
          aws cloudfront wait invalidation-completed \
            --distribution-id "${DISTRIBUTION}" --id "${INVALIDATION}"

          echo "확인 대상: ${URL}"
          html="$(curl -fsS --max-time 20 "${URL}/")"

          # 주소가 200으로 답했다는 것과 **우리 화면**이 답했다는 것은 다른
          # 사실이다. 전에 포트가 응답하는 것만 보고 다른 앱을 우리 것이라
          # 보고했다. 그래서 제목을 본다.
          echo "${html}" | grep -q '<title>VADA</title>' || {
            echo "배포 주소가 VADA 화면을 주지 않습니다."
            exit 1
          }
          echo "${html}" | grep -q '/assets/' || {
            echo "빌드된 꾸러미를 가리키지 않습니다. 올라간 것이 빌드 결과가 아닙니다."
            exit 1
          }
          echo "첫 화면 → VADA"

          # 주소를 직접 치거나 새로고침한 경우다. S3에는 이런 키가 없으므로
          # 되돌림이 없으면 403이 온다 — 앱은 멀쩡한데 새로고침만 깨진다.
          deep="$(curl -fsS --max-time 20 "${URL}/organization/roles")"
          echo "${deep}" | grep -q '<title>VADA</title>' || {
            echo "깊은 주소가 앱에 닿지 않습니다. 새로고침하면 깨집니다."
            exit 1
          }
          echo "깊은 주소 → VADA"

          # **상태 코드가 아니라 본문을 맞춰 본다.** `/api/v1/*` 규칙이 안 걸리면
          # 화면 되돌림이 index.html을 200으로 돌려준다. 상태 코드만 보면
          # 통과하는데, 화면에서는 모든 요청이 HTML을 받아 아무것도 안 나온다.
          same_origin="$(curl -fsS --max-time 20 "${URL}/api/v1/health")"
          if [ "${same_origin}" != '{"status":"ok"}' ]; then
            echo "같은 출처의 API가 답하지 않습니다: ${same_origin:0:120}"
            echo "CloudFront의 /api/v1/* 규칙이나 접두사 제거를 보십시오."
            exit 1
          fi
          echo "같은 출처 API → ${same_origin}"

          # 화면이 로그인 상대를 아는가. 이 파일이 없으면 배포에서 앱은 아예
          # 뜨지 않는다 — 그때 화면은 "로그인하지 못했습니다"를 그린다.
          config="$(curl -fsS --max-time 20 "${URL}/config.json")"
          echo "${config}" | jq -e \
            --arg domain "${LOGIN_URL}" --arg client "${CLIENT_ID}" \
            '.loginDomain == $domain and .clientId == $client' >/dev/null || {
            echo "배포 설정이 실제로 만들어진 것과 다릅니다: ${config}"
            exit 1
          }
          echo "배포 설정 → ${LOGIN_URL}"

          # **로그인은 양쪽을 다 봐야 한다.** 되돌아올 주소가 등록되지 않았다는
          # 것은 사람이 로그인 버튼을 눌러야만 드러나고, 그때 Cognito는
          # `redirect_mismatch`라고만 답한다.
          authorize="${LOGIN_URL}/oauth2/authorize?response_type=code&scope=openid+email&client_id=${CLIENT_ID}"
          encoded="$(jq -rn --arg value "${LOGIN_CALLBACK}" '$value|@uri')"

          admitted="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "${authorize}&redirect_uri=${encoded}")"
          case "${admitted}" in
            200 | 302) echo "등록된 주소로 되돌리기 → ${admitted}" ;;
            *)
              echo "로그인 화면이 우리 주소를 모릅니다 (${admitted})."
              echo "콜백 주소: ${LOGIN_CALLBACK}"
              exit 1
              ;;
          esac

          # 상태 코드가 아니라 **어디로 보내려 하는지**를 본다. Cognito가 거절을
          # 400으로 그리든 오류 페이지로 넘기든, 걸러야 할 것은 하나다 —
          # 등록되지 않은 주소로 사람을 보내는 것.
          stranger="$(curl -s -o /dev/null -D - --max-time 20 \
            "${authorize}&redirect_uri=https%3A%2F%2Fexample.invalid%2Fauth%2Fcallback" \
            | grep -i '^location:' || true)"

          if echo "${stranger}" | grep -qi 'example\.invalid'; then
            echo "등록되지 않은 주소로 되돌려 보냅니다. 로그인한 사람을 아무 데나 보낼 수 있습니다."
            exit 1
          fi
          if echo "${stranger}" | grep -qi '/login'; then
            echo "등록되지 않은 주소를 받고도 로그인 화면을 띄웁니다."
            exit 1
          fi
          echo "낯선 주소로 되돌리기 → 거절"
