name: CI

# 빠진 입력 검사·타입 오류를 사람이 아닌 기계가 막는다. 규칙은 AGENTS.md 참고.
on:
  pull_request:
  push:
    # 조각 가지는 로컬 검사와 관련 시험만 돌고, 전체 시험은 main에서 한 번 돈다(docs/work-method.md 원칙 8).
    # 가지에서 꼭 필요하면 손으로 돌린다: gh workflow run CI --ref <가지>
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 같은 가지에 새로 올리면 앞의 실행을 멈춘다. main은 배포가 그 결과를 기다리므로 멈추지 않는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # main에 올라오는 커밋은 대부분 묶음 가지에서 손으로 돌린 CI(workflow_dispatch)가 같은 커밋에서 이미 통과했다.
  # 빨리 감기로 올리면 커밋(SHA)이 같으므로 코드와 이 파일까지 같다. 그때는 시험과 검사를 다시 돌리지 않고 migrate-production만 돈다.
  # 조회가 실패하거나 찾지 못하면 hit은 비고 시험을 모두 돈다.
  already-tested:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      hit: ${{ steps.find.outputs.hit }}
    steps:
      - id: find
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&event=workflow_dispatch" --jq '.total_count') || n=0
          echo "passed dispatch runs for ${GITHUB_SHA}: ${n}"
          if [ "${n}" -gt 0 ] 2>/dev/null; then echo "hit=true" >> "$GITHUB_OUTPUT"; fi

  # API 시험이 한 작업에서 8분, 전체가 10~15분이 되어 상한(15분)에 걸려 main이 취소됐다(2026-10-22).
  # 시험을 나눠 나란히 돌린다. 비공개였을 때는 작업마다 분 단위로 올림되어 청구돼 작업 수를 최소로 뒀다
  # (다섯으로 나눴을 때 한 번에 약 17~20분, 그날 무료 시간 2,000분을 넘겼다). 지금은 공개 저장소라 시간이 무료다.
  # 둘로 나눴을 때 6~9분으로 CI 전체를 붙잡아(2026-10-28) 넷으로 나눈다.
  test-api:
    needs: already-tested
    if: needs.already-tested.outputs.hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm 버전은 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/api
        run: pnpm exec tsx --test --test-shard=${{ matrix.shard }}/4 "src/**/*.test.ts" "scripts/**/*.test.ts"

  # 화면 시험은 check 안에서 차례로 돌 때 2.5~4분이 걸려(2026-10-28) 따로 나눠 나란히 돈다.
  test-web:
    needs: already-tested
    if: needs.already-tested.outputs.hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm 버전은 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/web
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/2

  check:
    needs: already-tested
    if: needs.already-tested.outputs.hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm 버전은 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint --format github
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm --filter @vada/contracts test
      - run: node --test .claude/hooks/block-db-commands.test.mjs
      - run: pnpm --filter @vada/web build
      # Render와 같은 시작 명령(npm --prefix apps/api start)으로 운영 모드를 띄워 health 응답까지 본다. 시작 시 예외·빌드 누락·설정 오류처럼 어디서나 나는 문제를 배포 전에 잡는다.
      # Render 무료 인스턴스에서만 난 시작 멈춤(2026-10-07)은 여기서 재현되지 않았다. 그런 문제까지 막아 주지는 못한다.
      # 값은 모두 가짜이고, DB에는 연결하지 않으며 SENTRY_DSN은 존재하지 않는 도메인을 가리켜 외부로 아무것도 보내지 않는다.
      - name: Start in production mode
        env:
          DATABASE_URL: postgres://smoke:smoke@127.0.0.1:1/smoke
          BETTER_AUTH_SECRET: ci-start-smoke-secret-0123456789abcdef
          BETTER_AUTH_URL: http://127.0.0.1:8899
          GOOGLE_CLIENT_ID: ci-start-smoke
          GOOGLE_CLIENT_SECRET: ci-start-smoke
          SENTRY_DSN: https://0123456789abcdef0123456789abcdef@sentry.invalid/1
          PORT: '8899'
          HOST: 127.0.0.1
        run: |
          # 알림 열쇠는 형식 검사를 받으므로 실행할 때마다 새로 만든다. 어디에도 남지 않는다.
          eval "$(node -e "const k=require('./apps/api/node_modules/web-push').generateVAPIDKeys();console.log('export VAPID_PUBLIC_KEY='+k.publicKey+' VAPID_PRIVATE_KEY='+k.privateKey)")"
          export VAPID_SUBJECT=mailto:ci@vada.invalid
          npm --prefix apps/api start > start.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8899/api/health > /dev/null; then
              echo "started in ${i}s"; cat start.log
              grep -q '휴대폰 알림 켜짐' start.log || { echo "push routes were not enabled"; exit 1; }
              exit 0
            fi
            sleep 1
          done
          echo "server did not answer /api/health within 90s"; cat start.log; exit 1

  # 운영 DB 마이그레이션. main에서 시험과 검사가 모두 통과하면 적용한다. 사람이 손으로 적용하다 빠뜨리지 않게 한다.
  # Render는 CI가 통과한 뒤에 배포하므로(Auto-Deploy: After CI Checks Pass) DB가 새 코드보다 먼저 바뀐다(AGENTS.md 마이그레이션).
  # 적용할 것이 없으면 아무것도 바꾸지 않는다. 비밀값이 없거나 점검·적용이 실패하면 이 작업이 실패해 배포도 멈춘다.
  # 적용은 한 트랜잭션이라 실패하면 DB는 그대로다.
  # 같은 커밋이 이미 통과해 시험이 건너뛰어지면(skipped) 그대로 돈다. 앞 작업 중 하나라도 실패·취소면 돌지 않는다.
  migrate-production:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !cancelled()
      && needs.already-tested.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    needs: [already-tested, test-api, test-web, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm 버전은 package.json의 packageManager를 따른다.
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to production
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pnpm --filter @vada/api db:migrate --from-shell --apply
