name: CI

# 빠진 입력 검사·타입 오류를 사람이 아닌 기계가 막는다. 규칙은 AGENTS.md 참고.
on:
  pull_request:
  push:
    # 조각 가지는 로컬 검사와 관련 시험만 돌고, 전체 시험은 main에서 한 번 돈다(docs/work-method.md 원칙 8).
    # 가지에서 꼭 필요하면 손으로 돌린다: gh workflow run CI --ref <가지>
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 같은 가지에 새로 올리면 앞의 실행을 멈춘다. main은 배포가 그 결과를 기다리므로 멈추지 않는다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # API 시험이 한 작업에서 8분, 전체가 10~15분이 되어 상한(15분)에 걸려 main이 취소됐다(2026-10-22).
  # 시험을 나눠 나란히 돌린다. 비공개 저장소라 Actions 시간이 작업마다 분 단위로 올림되어 청구되므로
  # 작업 수는 최소로 둔다(다섯으로 나눴을 때 한 번에 약 17~20분, 그날 무료 시간 2,000분을 넘겼다).
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - working-directory: apps/api
        run: npx tsx --test --test-shard=${{ matrix.shard }}/2 "src/**/*.test.ts" "scripts/**/*.test.ts"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint -- --format github
      - run: npm run typecheck
      - run: npm run knip
      - run: npm test --workspace @vada/contracts
      - run: npm test --workspace @vada/web
      - run: node --test .claude/hooks/block-db-commands.test.mjs
      - run: npm run build --workspace @vada/web
      # Render와 같은 명령(npm start)으로 운영 모드를 띄워 health 응답까지 본다. 시작 시 예외·빌드 누락·설정 오류처럼 어디서나 나는 문제를 배포 전에 잡는다.
      # Render 무료 인스턴스에서만 난 시작 멈춤(2026-10-07)은 여기서 재현되지 않았다. 그런 문제까지 막아 주지는 못한다.
      # 값은 모두 가짜이고, DB에는 연결하지 않으며 SENTRY_DSN은 존재하지 않는 도메인을 가리켜 외부로 아무것도 보내지 않는다.
      - name: Start in production mode
        env:
          DATABASE_URL: postgres://smoke:smoke@127.0.0.1:1/smoke
          BETTER_AUTH_SECRET: ci-start-smoke-secret-0123456789abcdef
          BETTER_AUTH_URL: http://127.0.0.1:8899
          GOOGLE_CLIENT_ID: ci-start-smoke
          GOOGLE_CLIENT_SECRET: ci-start-smoke
          SENTRY_DSN: https://0123456789abcdef0123456789abcdef@sentry.invalid/1
          PORT: '8899'
          HOST: 127.0.0.1
        run: |
          # 알림 열쇠는 형식 검사를 받으므로 실행할 때마다 새로 만든다. 어디에도 남지 않는다.
          eval "$(node -e "const k=require('web-push').generateVAPIDKeys();console.log('export VAPID_PUBLIC_KEY='+k.publicKey+' VAPID_PRIVATE_KEY='+k.privateKey)")"
          export VAPID_SUBJECT=mailto:ci@vada.invalid
          npm start > start.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8899/api/health > /dev/null; then
              echo "started in ${i}s"; cat start.log
              grep -q '휴대폰 알림 켜짐' start.log || { echo "push routes were not enabled"; exit 1; }
              exit 0
            fi
            sleep 1
          done
          echo "server did not answer /api/health within 90s"; cat start.log; exit 1

  # 운영 DB 마이그레이션. main에서 시험과 검사가 모두 통과하면 적용한다. 사람이 손으로 적용하다 빠뜨리지 않게 한다.
  # Render는 CI가 통과한 뒤에 배포하므로(Auto-Deploy: After CI Checks Pass) DB가 새 코드보다 먼저 바뀐다(AGENTS.md 마이그레이션).
  # 적용할 것이 없으면 아무것도 바꾸지 않는다. 비밀값이 없거나 점검·적용이 실패하면 이 작업이 실패해 배포도 멈춘다.
  # 적용은 한 트랜잭션이라 실패하면 DB는 그대로다.
  migrate-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-api, check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply migrations to production
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npm run db:migrate --workspace @vada/api -- --from-shell --apply
