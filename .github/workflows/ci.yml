name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.scopes.outputs.api }}
      web: ${{ steps.scopes.outputs.web }}
      infra: ${{ steps.scopes.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect affected product scopes
        id: scopes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/detect-ci-scopes.mjs --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test contract and screen validators
        run: pnpm test:contracts && pnpm test:screens && pnpm test:tooling
      - name: Validate contracts and screens
        run: pnpm validate:contracts && pnpm validate:screens

  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vada_test
          POSTGRES_PASSWORD: vada_test
          POSTGRES_DB: vada_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vada_test -d vada_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VADA_TEST_DATABASE_URL: postgresql+psycopg://vada_test:vada_test@127.0.0.1:5432/vada_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies (lockfile 검증 포함)
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck (pyright strict)
        run: uv run pyright
      - name: Test API except PostgreSQL integration
        run: uv run pytest -m "not postgres"
      - name: PostgreSQL integration tests
        run: uv run pytest -m postgres

  terraform:
    name: terraform
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: 'true'
    defaults:
      run:
        working-directory: infra/modules/purchase_request_observability
    steps:
      # Immutable release SHAs prevent a moved tag from changing trusted CI code.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize providers without a backend
        run: terraform init -backend=false -input=false
      - name: Validate Terraform configuration
        run: terraform validate -no-color

  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install (lockfile 검증 포함)
        run: pnpm install --frozen-lockfile
      - name: Verify deterministic OpenAPI client generation
        run: pnpm test:openapi-client && pnpm validate:openapi-client
      - name: Lint (eslint)
        run: pnpm --filter web lint
      - name: Typecheck (tsc)
        run: pnpm --filter @vada/api-client typecheck && pnpm --filter web typecheck
      - name: Test (vitest)
        run: pnpm --filter web test
      - name: Build
        run: pnpm --filter web build
      - name: Build wireframe prototype
        run: pnpm --filter @vada/wireframe build
