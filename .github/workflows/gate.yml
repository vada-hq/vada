# 게이트를 원격에서 돈다.
#
# **이 파일은 오랫동안 한 번도 돌지 않았다.** 저장소에 git 원격이 없었기 때문이다
# (2026-08-27에 그렇게 적어 두었다). 그리고 2026-08-31에 원격이 생겨 처음 돌기 직전에
# 보니 **틀려 있었다** — `apps/vada-web`만 설치하는데 게이트는 앱 셋을 전부 돌린다.
# `validate`는 spec-service의 ajv가, `test`는 api의 PGlite·Drizzle이 필요하다.
#
# 돌지 않는 검사는 검사가 아니다. 그 상태로 몇 주가 지났다.
#
# ## 여기가 브라우저 검사의 유일한 자리다 (2026-08-31)
#
# 밀어내기 훅에서 e2e를 뺐다. 훅과 여기가 같은 일을 두 번 하고 있었고, 그 두 번 중
# 느린 쪽이 남은 메모리 0.4GB인 사람의 기계였다(5.4분). 이제 브라우저는 여기서만
# 돈다 — **이 파일이 깨지면 아무도 e2e를 돌리지 않는다.**

name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    # 계약은 빠르고 브라우저가 필요 없다. 따로 두면 실패를 먼저 안다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 명세 검증은 spec-service의 ajv를 쓴다.
      - run: npm ci --prefix apps/spec-service
      - name: 명세 검증
        run: npm run validate
      - name: 계약 검사
        run: npm run test:contracts

  screens:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `npm test`는 앱 셋을 나란히 돌린다. 하나라도 빠지면 그 앱이 통째로 죽는다.
      - run: npm ci --prefix apps/spec-service
      - run: npm ci --prefix apps/vada-web
      - run: npm ci --prefix apps/api
      - name: 화면·계약·서버 검사
        run: npm test
      - name: 빌드
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix apps/vada-web
      # 서버에 대고 화면을 그리는 검사가 api를 직접 가져다 쓴다(진짜 Postgres).
      - run: npm ci --prefix apps/api
      - run: npx --prefix apps/vada-web playwright install --with-deps chromium
      - name: 시나리오 검사
        run: npm run e2e
