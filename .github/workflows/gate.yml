# 게이트를 원격에서 돈다.
#
# **이 파일은 오랫동안 한 번도 돌지 않았다.** 저장소에 git 원격이 없었기 때문이다
# (2026-08-27에 그렇게 적어 두었다). 그리고 2026-08-31에 원격이 생겨 처음 돌기 직전에
# 보니 **틀려 있었다** — `apps/vada-web`만 설치하는데 게이트는 앱 셋을 전부 돌린다.
# `validate`는 spec-service의 ajv가, `test`는 api의 PGlite·Drizzle이 필요하다.
#
# 돌지 않는 검사는 검사가 아니다. 그 상태로 몇 주가 지났다.
#
# **`--prefix`를 쓰지 않는다.** `npm ci --prefix apps/api`가 리눅스에서 "Missing:
# @esbuild/linux-x64@0.28.2 from lock file"로 죽었다 — npm이 어느 자리에서 트리를
# 맞추는지가 `--prefix`와 `working-directory`에서 달랐다. 그 앱 안에서 도는 것이
# 사람이 손으로 하는 것과 같고, 같아야 이 검사가 사람의 기계를 흉내 낸다.
#
# ## 여기가 브라우저 검사의 유일한 자리다 (2026-08-31)
#
# 밀어내기 훅에서 e2e를 뺐다. 훅과 여기가 같은 일을 두 번 하고 있었고, 그 두 번 중
# 느린 쪽이 남은 메모리 0.4GB인 사람의 기계였다(5.4분). 이제 브라우저는 여기서만
# 돈다 — **이 파일이 깨지면 아무도 e2e를 돌리지 않는다.**

name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    # 계약은 빠르고 브라우저가 필요 없다. 따로 두면 실패를 먼저 안다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # **npm도 못 박는다.** 러너에 딸려 오는 npm과 사람의 npm이 다르면 같은 잠금
      # 파일에서 다른 트리가 나오고, `npm ci`는 그것을 "잠금이 package.json과 어긋난다"고
      # 읽는다 — `esbuild@0.28.2`이 잠금에 있는데도 없다고 했다. 잠금은 npm이 쓴 것이므로
      # 읽는 npm도 같아야 한다.
      - run: npm i -g npm@11
      # 명세 검증은 spec-service의 ajv를 쓴다.
      - run: npm ci
        working-directory: apps/spec-service
      - name: 명세 검증
        run: npm run validate
      - name: 계약 검사
        run: npm run test:contracts

  screens:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # **npm도 못 박는다.** 러너에 딸려 오는 npm과 사람의 npm이 다르면 같은 잠금
      # 파일에서 다른 트리가 나오고, `npm ci`는 그것을 "잠금이 package.json과 어긋난다"고
      # 읽는다 — `esbuild@0.28.2`이 잠금에 있는데도 없다고 했다. 잠금은 npm이 쓴 것이므로
      # 읽는 npm도 같아야 한다.
      - run: npm i -g npm@11
      # `npm test`는 앱 셋을 나란히 돌린다. 하나라도 빠지면 그 앱이 통째로 죽는다.
      - run: npm ci
        working-directory: apps/spec-service
      - run: npm ci
        working-directory: apps/vada-web
      - run: npm ci
        working-directory: apps/api
      - name: 화면·계약·서버 검사
        run: npm test
      - name: 빌드
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # **npm도 못 박는다.** 러너에 딸려 오는 npm과 사람의 npm이 다르면 같은 잠금
      # 파일에서 다른 트리가 나오고, `npm ci`는 그것을 "잠금이 package.json과 어긋난다"고
      # 읽는다 — `esbuild@0.28.2`이 잠금에 있는데도 없다고 했다. 잠금은 npm이 쓴 것이므로
      # 읽는 npm도 같아야 한다.
      - run: npm i -g npm@11
      - run: npm ci
        working-directory: apps/vada-web
      # 서버에 대고 화면을 그리는 검사가 api를 직접 가져다 쓴다(진짜 Postgres).
      - run: npm ci
        working-directory: apps/api
      - run: npx playwright install --with-deps chromium
        working-directory: apps/vada-web
      - name: 시나리오 검사
        run: npm run e2e
      # **나가는 묶음을 사람이 여는 그대로 연다.** 위의 시나리오 검사는 개발용
      # 응답으로 만든 묶음을 보므로, 실서비스로 나가는 것은 여기서만 열린다 —
      # 2026-09-05에 사람이 배포된 화면에서 남의 값을 보고서야 그 구멍을 알았다.
      - name: 출하 카나리
        run: npm run canary

  # **배포된 사슬을 두드린다.**
  #
  # 위의 셋은 전부 이 기계 안을 잰다 — 카나리조차 로컬 PGlite에 나가는 묶음을 붙여
  # 놓고 본다. 사람이 여는 것은 Worker와 Render와 Neon이 이어진 것이고, 그 자리에서
  # 난 일은 오늘까지 전부 사람이 눈으로 찾았다.
  #
  # **main에 밀었을 때만 돈다.** 배포는 밀어야 일어난다. Cloudflare와 Render가 저마다
  # 도는 동안 기다렸다가 두드린다(scripts/smoke.mjs가 여섯 번까지 기다린다).
  #
  # **막지 않고 알린다**(continue-on-error). 배포가 늦거나 Render가 잠들었을 뿐인데
  # 초록을 빨갛게 만들면 사람이 이 줄을 곧 무시하게 된다 — 판정이 아니라 알림이다.
  # 이것이 두 번 헛되이 울면 그때 기다림을 늘리고, 진짜를 잡으면 그때 막는 자리로 옮긴다.
  연기:
    name: 배포된 것 두드리기
    runs-on: ubuntu-latest
    needs: browser
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 배포를 기다렸다 두드린다
        run: npm run smoke
