# 배포된 VADA에 첫 사람을 넣는다. **사람이 손으로 한 번 돌린다.**
#
#   gh workflow run provision-first-person.yml \
#     -f email='<로그인 이메일>' -f display_name='<이름>' -f organization_name='<학생회 이름>'
#
# **이것은 가입 흐름이 아니다.** 가입 흐름(ONB-01·ORG-01)이 생기면 이 파일은
# 통째로 지운다. 그때까지 배포된 VADA에는 사람을 들여보낼 길이 없다 —
# Cognito 계정만으로는 `/session/viewer`가 401로 답한다. 그 신원이 VADA에
# 등록된 적이 없기 때문이고, 그것은 올바른 답이다.
#
# 개인정보를 저장소에 두지 않으려고 입력으로 받는다. 저장소 변수로 두면
# 누군가의 이메일이 git 이력에 영구히 남는다.
name: provision-first-person

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Cognito 로그인 이메일. 계정이 이미 있어야 한다"
        required: true
      display_name:
        description: "화면에 보일 이름"
        required: true
      organization_name:
        description: "학생회 이름. 이미 있으면 그것을 쓴다"
        required: true
        default: "소프트웨어융합대학 학생회"

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  provision:
    name: provision
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false

      # 상수를 여기 다시 적지 않는다. 사용자 풀 이름과 SSM 자리는 이미
      # Terraform이 소유하고 있고, 베껴 적으면 언젠가 한쪽만 바뀐다.
      - name: Read what is deployed
        id: deployed
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          {
            echo "pool=$(terraform output -raw user_pool_id)"
            echo "issuer=$(terraform output -raw user_pool_issuer)"
            echo "database_parameter=$(terraform output -raw database_url_parameter)"
            echo "database_branch=$(terraform output -raw database_branch)"
          } >> "$GITHUB_OUTPUT"

      - name: Put the person into VADA
        env:
          POOL: ${{ steps.deployed.outputs.pool }}
          ISSUER: ${{ steps.deployed.outputs.issuer }}
          DATABASE_PARAMETER: ${{ steps.deployed.outputs.database_parameter }}
          EXPECTED_BRANCH: ${{ steps.deployed.outputs.database_branch }}
          EMAIL: ${{ inputs.email }}
          DISPLAY_NAME: ${{ inputs.display_name }}
          ORGANIZATION_NAME: ${{ inputs.organization_name }}
        run: |
          # Cognito의 `sub`가 VADA와 신원을 잇는 열쇠다. 이메일이 아니다 —
          # 이메일은 바뀔 수 있고, 바뀌면 그 사람의 기록이 끊긴다.
          subject="$(aws cognito-idp admin-get-user \
            --user-pool-id "${POOL}" --username "${EMAIL}" \
            --query "UserAttributes[?Name=='sub'].Value" --output text)"

          if [ -z "${subject}" ] || [ "${subject}" = "None" ]; then
            echo "${EMAIL} 계정을 사용자 풀에서 찾지 못했습니다."
            echo "먼저 Cognito 계정을 만드십시오 — infra/README.md를 보십시오."
            exit 1
          fi
          echo "신원: ${EMAIL} → ${subject}"

          url="$(aws ssm get-parameter --name "${DATABASE_PARAMETER}" \
            --with-decryption --query 'Parameter.Value' --output text)"
          plain="${url/postgresql+psycopg:/postgresql:}"

          # 어느 데이터베이스에 쓰는지 확인하고 쓴다. 배포가 하는 것과 같은 검사다.
          branch="$(psql "${plain}" -tAqc \
            "select current_setting('neon.branch_id', true)")"
          echo "데이터베이스 브랜치: ${branch}"
          if [ "${branch}" != "${EXPECTED_BRANCH}" ]; then
            echo "정본이 기대하는 것은 ${EXPECTED_BRANCH}입니다."
            exit 1
          fi

          # 마이그레이션은 아직 사람이 돌린다(걷는 뼈대의 하지 않은 것).
          # 안 돌렸으면 아래 INSERT가 알 수 없는 컬럼 오류로 죽는다. 먼저 본다.
          has_role="$(psql "${plain}" -tAqc "
            select count(*) from information_schema.columns
            where table_name = 'organization_memberships' and column_name = 'role'")"
          if [ "${has_role}" != "1" ]; then
            echo "배포용 데이터베이스에 마이그레이션이 덜 적용됐습니다."
            echo "'just migrate'를 배포용 연결 문자열로 한 번 돌려야 합니다."
            exit 1
          fi

          # 여러 번 돌려도 같은 상태가 된다. 이름을 고치려고 다시 돌릴 수 있다.
          psql "${plain}" -v ON_ERROR_STOP=1 -q \
            -v subject="${subject}" \
            -v display_name="${DISPLAY_NAME}" \
            -v organization_name="${ORGANIZATION_NAME}" \
            -v issuer="${ISSUER}" <<'SQL'
          -- 같은 이름의 학생회가 이미 있으면 그것을 쓴다. 사람마다 새 조직을
          -- 만들면 서로를 못 본다.
          INSERT INTO organizations (organization_id, name)
          SELECT 'organization-' || md5(:'organization_name'), :'organization_name'
          WHERE NOT EXISTS (
            SELECT 1 FROM organizations WHERE name = :'organization_name'
          );

          INSERT INTO vada_users (user_id, display_name)
          VALUES (:'subject', :'display_name')
          ON CONFLICT (user_id) DO UPDATE SET display_name = EXCLUDED.display_name;

          INSERT INTO cognito_identities (issuer, subject, user_id)
          VALUES (:'issuer', :'subject', :'subject')
          ON CONFLICT (issuer, subject) DO UPDATE SET user_id = EXCLUDED.user_id;

          -- 첫 사람은 회장단이다. 아무도 회장단이 아니면 구성원을 초대할 사람도
          -- 조직을 고칠 사람도 없다.
          INSERT INTO organization_memberships
            (membership_id, organization_id, user_id, is_active, role)
          SELECT
            'membership-' || :'subject',
            organizations.organization_id,
            :'subject',
            true,
            'president'
          FROM organizations
          WHERE organizations.name = :'organization_name'
          ON CONFLICT (organization_id, user_id)
          DO UPDATE SET is_active = true, role = 'president';
          SQL

          echo "${DISPLAY_NAME}님을 ${ORGANIZATION_NAME}의 회장단으로 넣었습니다."
          echo "배포된 주소를 새로고침하면 이름이 보입니다."
