[project]
name = "vada-api"
version = "0.1.0"
description = "VADA API — FastAPI 모듈형 모놀리스"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.15",
    "fastapi>=0.139",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "httpx>=0.28",
    "ruff>=0.15",
    "pyright>=1.1.411",
    "testcontainers[postgres]>=4.10",
    "pglast>=7",
    "schemathesis>=4.24.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vada_api"]

# ── Ruff: 넓게 select, 좁게 ignore (ADR: 린트·포맷) ──
[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM",  # 코어
    "S",                               # 보안(bandit) — 에이전트 코드 기본
    "RUF", "C4", "RET", "PTH", "FURB",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # 테스트의 assert 허용

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: requires a disposable PostgreSQL database or Docker daemon",
]
