[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# ASCII only: configparser reads this file in the locale encoding (cp949 on
# Korean Windows), so non-ASCII bytes here break every alembic command.
# Dialect only. This is the minimum an offline (--sql) DDL render needs.
# The database to apply to comes from VADA_DATABASE_URL; see migrations/env.py.
sqlalchemy.url = postgresql+psycopg://

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
