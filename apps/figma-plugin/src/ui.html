<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Figma Spec v2</title>
    <style>
      :root {
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
        font: 12px/1.5 Inter, sans-serif;
      }

      body {
        margin: 0;
        padding: 16px;
      }

      [hidden] {
        display: none !important;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 16px;
      }

      h2 {
        margin: 0;
        font-size: 14px;
      }

      button,
      input {
        font: inherit;
      }

      /* 식별자(nodeId·key·속성 이름)만 고정폭으로 쓴다. Consolas에는 한글
         글리프가 없어서 한글이 섞이면 시스템 한글 폰트로 갈라진다 — 그래서
         한글이 들어갈 수 있는 값(화면 이름·라벨)에는 code를 쓰지 않는다. */
      code {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }

      dt {
        margin: 0;
        color: var(--figma-color-text-secondary);
      }

      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }

      .context-card {
        margin-top: 16px;
        padding: 12px;
        border: 1px solid var(--figma-color-border);
        border-radius: 8px;
        background: var(--figma-color-bg-secondary);
      }

      .context-card p {
        margin: 4px 0 0;
        color: var(--figma-color-text-secondary);
      }

      #current-screen-summary {
        display: grid;
        gap: 4px;
        margin-top: 8px;
      }

      #current-screen-id {
        font-size: 14px;
        color: var(--figma-color-text-success);
      }

      #current-screen-name,
      #current-wireframe-key {
        overflow-wrap: anywhere;
      }

      #state-scope-summary {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--figma-color-border);
      }

      #state-scope-summary h3 {
        margin: 0 0 6px;
        font-size: 12px;
      }

      #state-scope-summary dl {
        display: grid;
        gap: 4px;
        margin: 0;
      }

      #state-scope-summary dl div {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 8px;
      }

      #state-scope-status[data-tone="error"] {
        color: var(--figma-color-text-danger, #f24822);
      }

      #save-figma-raw,
      #refresh-screen-spec {
        width: 100%;
        margin-top: 8px;
        padding: 8px;
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
        cursor: pointer;
      }

      #save-figma-raw:disabled,
      #refresh-screen-spec:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      #screen-save-status {
        margin-top: 8px;
      }

      #screen-save-status[data-tone="error"] {
        color: var(--figma-color-text-danger, #f24822);
      }

      #selected-node-heading {
        margin: 24px 0 8px;
      }

      #empty-state {
        padding: 12px;
        border: 1px dashed var(--figma-color-border);
        border-radius: 6px;
        color: var(--figma-color-text-secondary);
        text-align: center;
      }

      #selection-details {
        display: grid;
        gap: 4px;
        margin: 0;
      }

      #selection-details div {
        display: grid;
        grid-template-columns: 64px minmax(0, 1fr);
        gap: 8px;
      }

      #screen-selection-section label {
        display: grid;
        gap: 4px;
        margin-top: 8px;
        color: var(--figma-color-text-secondary);
      }

      #screen-selection-section input {
        padding: 6px 8px;
        border: 1px solid var(--figma-color-border);
        border-radius: 4px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
      }

      #screen-selection-section input:focus {
        outline: 1px solid var(--figma-color-border-selected);
      }

      #set-active-screen {
        width: 100%;
        margin-top: 12px;
        padding: 8px;
        border: 1px solid var(--figma-color-border-selected);
        border-radius: 6px;
        color: var(--figma-color-text-onbrand);
        background: var(--figma-color-bg-brand);
        cursor: pointer;
      }

      #set-active-screen:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      #screen-context-error {
        color: var(--figma-color-text-danger, #f24822);
      }

      #selection-notice {
        margin-top: 12px;
        padding: 8px;
        border-radius: 4px;
        color: var(--figma-color-text-secondary);
        background: var(--figma-color-bg-secondary);
      }

      /* 화면 명세는 읽기 전용이다. 로컬 screen.json이 유일한 원본이고
         플러그인은 그것을 보여주기만 한다. */
      #screen-spec-section {
        margin-top: 24px;
      }

      #screen-spec-status {
        margin: 8px 0 0;
        color: var(--figma-color-text-secondary);
      }

      #screen-spec-status[data-tone="error"] {
        color: var(--figma-color-text-danger, #f24822);
      }

      #screen-spec-elements {
        display: grid;
        gap: 8px;
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
      }

      .spec-element {
        padding: 10px;
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
      }

      .spec-element[data-selected="true"] {
        border-color: var(--figma-color-border-selected);
        background: var(--figma-color-bg-secondary);
      }

      .spec-element-heading {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
      }

      .spec-element-index {
        color: var(--figma-color-text-tertiary);
      }

      .spec-element-type {
        padding: 1px 6px;
        border-radius: 4px;
        color: var(--figma-color-text-secondary);
        background: var(--figma-color-bg-tertiary);
        font-size: 10px;
      }

      .spec-element-identity {
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      .spec-element-node {
        color: var(--figma-color-text-tertiary);
      }

      .spec-properties {
        display: grid;
        gap: 2px;
        margin: 8px 0 0;
      }

      .spec-properties div {
        display: grid;
        grid-template-columns: 116px minmax(0, 1fr);
        gap: 8px;
      }

      .spec-nested {
        margin-left: 12px;
        padding-left: 8px;
        border-left: 1px solid var(--figma-color-border);
      }

      .spec-value-absent {
        color: var(--figma-color-text-tertiary);
      }

      /* 값의 근거. 확인해야 하는 것은 '추정'뿐이므로 그것만 눈에 띈다 */
      .spec-source {
        display: inline-block;
        margin-left: 4px;
        padding: 0 4px;
        border-radius: 3px;
        font-size: 10px;
        line-height: 15px;
        vertical-align: 1px;
        white-space: nowrap;
      }
      .spec-source-design,
      .spec-source-precedent {
        color: var(--figma-color-text-tertiary);
        background: var(--figma-color-bg-secondary);
      }
      .spec-source-authored {
        color: var(--figma-color-text-onwarning, #7a4b00);
        background: var(--figma-color-bg-warning-tertiary, #ffe8b3);
      }
    </style>
  </head>
  <body>
    <h1>Figma Spec v2</h1>

    <section id="current-screen-section" class="context-card">
      <h2>현재 작업 화면</h2>
      <p id="current-screen-empty">아직 작업 화면을 선택하지 않았습니다.</p>
      <div id="current-screen-summary" hidden>
        <strong id="current-screen-id"></strong>
        <span id="current-screen-name"></span>
        <code id="current-wireframe-key"></code>
        <section id="state-scope-summary" hidden>
          <h3>입력값 처리</h3>
          <dl>
            <div>
              <dt>스코프</dt>
              <dd><code id="state-scope-key"></code></dd>
            </div>
            <div>
              <dt>유지</dt>
              <dd id="state-scope-retention"></dd>
            </div>
            <div>
              <dt>제거</dt>
              <dd id="state-scope-clear-on"></dd>
            </div>
          </dl>
          <p id="state-scope-status" role="status"></p>
        </section>
      </div>
      <button id="save-figma-raw" type="button" hidden>
        Figma 원본 JSON 저장
      </button>
      <button id="refresh-screen-spec" type="button" hidden>
        명세 새로고침
      </button>
      <p id="screen-save-status" role="status" hidden></p>
    </section>

    <h2 id="selected-node-heading">선택한 노드</h2>
    <div id="empty-state">Figma 요소를 선택하세요.</div>
    <dl id="selection-details" hidden>
      <div>
        <dt>nodeId</dt>
        <dd><code id="node-id"></code></dd>
      </div>
      <div>
        <dt>name</dt>
        <dd id="node-name"></dd>
      </div>
      <div>
        <dt>type</dt>
        <dd><code id="node-type"></code></dd>
      </div>
    </dl>

    <section id="screen-selection-section" class="context-card" hidden>
      <h2 id="screen-selection-title">작업 화면 선택</h2>
      <p id="screen-selection-description"></p>
      <label>
        wireframeKey
        <input
          id="wireframe-key-input"
          type="text"
          autocomplete="off"
          placeholder="예: vada-onboarding"
        />
      </label>
      <label>
        screenId
        <input
          id="screen-id-input"
          type="text"
          autocomplete="off"
          placeholder="예: ONB-01"
        />
      </label>
      <button id="set-active-screen" type="button">
        이 화면에서 작업하기
      </button>
      <p id="screen-context-error" role="alert" hidden></p>
    </section>

    <div id="selection-notice" role="status" hidden></div>

    <section id="screen-spec-section" hidden>
      <h2>화면 명세</h2>
      <p id="screen-spec-status" role="status"></p>
      <ol id="screen-spec-elements"></ol>
    </section>

    <!-- UI_SCRIPT -->
  </body>
</html>
