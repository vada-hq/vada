# api를 올리는 곳(Render).
#
# **Fly가 카드를 요구해서 여기로 왔다.** 값을 먼저 보되 유지보수성을 잃지 않는
# 선택이다 — **같은 Dockerfile을 그대로 쓴다.** 나중에 Fly로 옮길 때 코드는 한 줄도
# 바뀌지 않고 `apps/api/fly.toml`이 그 자리에 그대로 있다.
#
# 서버리스(Cloudflare Workers)로 가면 더 싸지만 서버를 다시 짜야 한다 — 이 저장소가
# 연결 풀을 상시로 두려고 **일부러 피한** 모양이다(docs/decisions/backend-architecture.md).
services:
  - type: web
    name: vada-api
    runtime: docker
    plan: free
    region: singapore
    # 빌드 문맥이 저장소 뿌리다 — api가 specs/를 읽으므로 apps/api만으로는 담을 수 없다.
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # 로그인 길을 묻는 자리다. 아무것도 없어도 200이라 살아 있는지 보기에 알맞다.
    #
    # **이 주소가 계약과 갈리면 배포가 스스로를 죽인다.** 서버는 계약에 없는 자리를
    # 403으로 막으므로 Render가 그것을 "안 건강하다"로 읽는다 — 코드는 초록인데 배포만
    # 죽는다. 실제로 그랬다(2026-09-02, 로그인 자리를 계약 안으로 옮기면서).
    # `tests/deploy-health.test.mjs`가 이 줄과 계약을 맞대 본다.
    healthCheckPath: /api/sign-in/ways
    envVars:
      # `sync: false`는 **값을 여기 적지 않는다**는 뜻이다. 대시보드에서 넣는다 —
      # 비밀을 저장소에 두지 않는다.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: INVITE_LINK_BASE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # 카카오는 둘 다 있거나 둘 다 없어야 한다(config.ts가 반쯤 켜진 것을 막는다).
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
